name: Publish to npm

# Publishing happens from a GitHub release, through npm Trusted Publishing:
# the job requests a short-lived OIDC token (id-token: write) and npm exchanges
# it for publish rights, so no NPM_TOKEN secret is stored anywhere.
#
# One-time setup on npmjs.com, package settings → Trusted Publisher → GitHub
# Actions: repository MonoIAR/beepblips, workflow file publish.yml, environment
# left blank. Until that trust exists, the Publish step is rejected by npm.
#
# A release whose tag predates this file (v0.1.0, v0.2.0) cannot trigger the
# workflow; run it by hand from the Actions tab for those.
on:
  release:
    types: [published]
  # Manual re-run for a release whose publish failed; the version check below
  # makes it a no-op when the version is already on npm.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check that index.html matches beepblips.js
        run: node build.mjs --check

      - name: Run the test suite
        run: npm test

      - name: Check whether this version is already published
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@monoiar/beepblips@$version" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@monoiar/beepblips@$version is already on npm; nothing to publish."
          fi

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
