version: 2

updates:
  # The workflows pin actions by tag; keep the tags current. One grouped PR a
  # month is enough for a repository that publishes on every push to main.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
